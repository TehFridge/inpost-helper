<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>InPost3DS nowe logowanie :p</title>
<script src="qrcodegen.js"></script>
<style>
  @font-face {
    font-family: "Rodin";
    src: url("Rodin-Regular.ttf") format("truetype");
    font-display: swap;
  }
  :root {
    --sq-a: #b3a23b;
    --sq-b: #998b2d;
    --gold: #b1a22f;
    --ink: #16140c;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: "Rodin", "Trebuchet MS", Verdana, sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
    text-align: center;
  }

  body::before {
    content: "";
    position: fixed;
    top: -50vh; left: -50vw;
    width: 200vw; height: 200vh;
    background: repeating-conic-gradient(var(--sq-a) 0% 25%, var(--sq-b) 0% 50%);
    background-size: 96px 96px;
    animation: drift 7s linear infinite;
    z-index: -2;
  }
  @keyframes drift {
    from { background-position: 0 0; }
    to { background-position: 96px 96px; }
  }
  #flash {
    position: fixed; inset: 0; background: #fff;
    opacity: 0; pointer-events: none; z-index: 50;
  }
  .wrap { max-width: 820px; margin: 0 auto; padding: 24px 22px;
    min-height: 100vh; min-height: 100svh;
    display: flex; flex-direction: column; justify-content: center; }

  .gt {
    color: var(--gold);
    text-shadow:
      -2px 0 0 #fff, 2px 0 0 #fff, 0 -2px 0 #fff, 0 2px 0 #fff,
      -2px -2px 0 #fff, 2px -2px 0 #fff, -2px 2px 0 #fff, 2px 2px 0 #fff,
      4px 4px 0 var(--ink);
  }
  .wt { color: #fff; text-shadow: 2px 2px 0 var(--ink); }
  .dim { color: #e8e2cd; text-shadow: 1px 1px 0 var(--ink); opacity: .85; }
  h1 { font-size: 72px; margin: 0; font-weight: normal; }
  .sub { font-size: 22px; margin: 12px 0 0; }
  /* one beat at a time, eased in from the right */
  #stage { min-height: 40vh; display: flex; align-items: center; justify-content: center; }
  .beat { font-size: 44px; width: 100%; animation: slidein .55s ease-out; }
  .beat.leave { animation: leave .22s ease-in forwards; }
  .beat .small { font-size: 24px; display: block; margin-top: 14px; }
  .beat .tiny { font-size: 18px; display: block; margin-top: 12px; overflow-wrap: break-word; }
  @keyframes slidein {
    from { opacity: 0; transform: translateX(120px); }
    to { opacity: 1; transform: none; }
  }
  @keyframes leave {
    to { opacity: 0; transform: translateX(-120px); }
  }
  @keyframes blink {
    0%, 49% { opacity: 1; }
    50%, 100% { opacity: 0; }
  }
  .blink { animation: blink 1s steps(1) infinite; }
  .tbtn {
    background: none; border: none; padding: 0; margin: 14px 0 0;
    font: inherit; cursor: pointer; color: inherit;
  }
  .uinput {
    background: transparent; border: none;
    border-bottom: 2px solid #fff;
    color: #fff; text-shadow: 1px 1px 0 var(--ink);
    font: inherit; font-size: 26px;
    width: 100%; max-width: 620px; padding: 8px 2px; text-align: center;
  }
  .uinput:focus { outline: none; border-bottom-color: var(--gold); }
  ::placeholder { color: #d8d2b8; opacity: .7; }
  .beat img.scr { display: block; max-width: 100%; width: 560px; height: auto; margin: 16px auto 0; }

  #qrBox {
    display: none;
    background: #fff;
    margin: 26px auto 0;
    padding: 22px;
    width: fit-content; max-width: 100%;
  }
  #qrBox.show { display: inline-block; animation: pop .4s cubic-bezier(.34,1.56,.64,1); }
  @keyframes pop {
    from { opacity: 0; transform: scale(.9); }
    to { opacity: 1; transform: scale(1); }
  }
  #qrBox canvas { max-width: 100%; height: auto; display: block; margin: 0 auto; }
  #qrBox p { color: #111; font-size: 17px; margin: 12px 0 0; }
  #qrBox code { font-family: "Rodin", monospace; font-size: 14px; word-break: break-all; }
  footer { margin-top: 40px; }
  footer p { font-size: 16px; }
  @media (max-width: 560px) {
    h1 { font-size: 46px; }
    .beat { font-size: 32px; }
    #stage { min-height: 34vh; }
  }
  @media (prefers-reduced-motion: reduce) {
    body::before { animation: none; }
    .beat, #qrBox.show { animation: none; }
    .blink { animation: none; }
  }
</style>
</head>
<body>
<div id="flash"></div>
<div class="wrap">
  <h1 class="gt">InPost3DS logowanie</h1>
  <p class="wt sub">wszystko robi komp a potem leci czy de es</p>
  <div id="stage"></div>

  <!-- THE box -->
  <div id="qrBox">
    <canvas id="qrCanvas"></canvas>
    <p id="qrCap"></p>
    <p><code id="qrStr"></code></p>
  </div>

  <footer>
    <p class="dim">:3c</p>
  </footer>
</div>

<script>
"use strict";
var S = { verifier: "", challenge: "", state: "", loginUrl: "", code: "" };
function $(id) { return document.getElementById(id); }
function b64url(buf) {
  var s = btoa(String.fromCharCode.apply(null, new Uint8Array(buf)));
  return s.replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
}
function rand(n, alpha) {
  var a = alpha || "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789-._~";
  var b = new Uint8Array(n); crypto.getRandomValues(b);
  var o = ""; for (var i = 0; i < n; i++) o += a[b[i] % a.length];
  return o;
}
function flash() {
  var f = $("flash");
  f.style.transition = "none";
  f.style.opacity = "1";
  void f.offsetWidth;
  f.style.transition = "opacity 1s ease-out";
  f.style.opacity = "0";
}

function show(html, gold, after) {
  var st = $("stage");
  var insert = function () {
    st.innerHTML = "";
    var d = document.createElement("div");
    d.className = "beat " + (gold === false ? "wt" : "gt");
    d.innerHTML = html;
    st.appendChild(d);
    if (after) after(d);
  };
  var old = st.firstChild;
  if (old) {
    old.classList.add("leave");
    setTimeout(insert, 200);
  } else {
    insert();
  }
  return st;
}
function tbtn(label, blink) {
  return '<button class="tbtn gt' + (blink ? " blink" : "") + '">' + label + "</button>";
}


function onGenerate() {
  if (!crypto.subtle) {
    show("Brak crypto — odpal na kompie lub telefonie.", false);
    return;
  }
  var verifier = rand(64, "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789-_");
  crypto.subtle.digest("SHA-256", new TextEncoder().encode(verifier)).then(function (h) {
    var ch = b64url(h);
    S.verifier = verifier;
    S.challenge = ch;
    S.state = rand(16);
    var nonce = rand(16);
    var gaS = String(1000000000 + Math.floor(Math.random() * 999999999));
    var gaI = rand(32, "0123456789abcdef");
    var fbId = rand(20, "0123456789abcdef") + "-tVetd";
    var q = new URLSearchParams({ response_type: "code", client_id: "inpost-mobile",
      redirect_uri: "https://account.inpost-group.com/callback", scope: "openid",
      code_challenge: ch, code_challenge_method: "S256",
      state: S.state, nonce: nonce, response_mode: "query", lang: "pl-PL",
      fb_installation_id: fbId, app_ga_session_id: gaS, app_ga_instance_id: gaI,
      theme: "light", openEmailButtonVisible: "false", supported_markets: "PL,IT" }).toString();
    S.loginUrl = "https://account.inpost-group.com/oauth2/authorize?" + q;
    flash();
    show(tbtn("KLIKNIJ BY SIE ZALOGOWAĆ", true) +
      '<span class="small wt">Najpierw numer telefonu, potem kod SMS, potem weryfikacja maila. TYLKO PLZ Nie zamykaj tych kart (tej i tej do logowania).</span>',
      true, function (beat) {
        beat.querySelector("button").onclick = onOpen;
      });
  });
}
function onOpen() {
  window.open(S.loginUrl, "_blank");
  flash();
  show("WKLEJ URL CALLBACK" +
    '<br><img class="scr" src="test_scr.png" alt="gdzie jest URL">' +
    '<br><input class="uinput" id="cb" placeholder="https://…/callback?code=…">' +
    "<br>" + tbtn("KLIKNIJ BY WYGENEROWAĆ KOD QR", true), false, function (beat) {
      var inp = beat.querySelector("#cb");
      inp.focus();
      var go = function () { onExtract(inp.value); };
      beat.querySelector("button").onclick = go;
      inp.addEventListener("keydown", function (e) { if (e.key === "Enter") go(); });
    });
}
function onExtract(raw) {
  var code = "", st = "";
  try {
    var u = new URL(raw.trim());
    code = u.searchParams.get("code") || "";
    st = u.searchParams.get("state") || "";
  } catch (e) { code = ""; }
  if (!code) {
    show("BRAK ?code= W TYM.", false);
    setTimeout(function () { location.reload(); }, 1200);
    return;
  }
  if (st && st !== S.state) {
    show("STATE SIE NIE ZGADZA — ZŁA KARTA?", false);
    setTimeout(function () { location.reload(); }, 1600);
    return;
  }
  S.code = code;
  flash();
  var text = '{"verifier":"' + S.verifier + '","code":"' + S.code + '"}';
  var qr;
  try {
    qr = qrcodegen.QrCode.encodeText(text, qrcodegen.QrCode.Ecc.MEDIUM);
  } catch (e) {
    show("QR SIE WYSYPAŁ.", false);
    return;
  }
  var border = 4;
  var maxPx = Math.min(460, window.innerWidth - 140);
  var scale = Math.max(2, Math.floor(maxPx / (qr.size + border * 2)));
  var cv = $("qrCanvas");
  cv.width = cv.height = (qr.size + border * 2) * scale;
  var ctx = cv.getContext("2d");
  ctx.fillStyle = "#ffffff";
  ctx.fillRect(0, 0, cv.width, cv.height);
  ctx.fillStyle = "#000000";
  for (var y = 0; y < qr.size; y++) {
    for (var x = 0; x < qr.size; x++) {
      if (qr.getModule(x, y)) ctx.fillRect((x + border) * scale, (y + border) * scale, scale, scale);
    }
  }
  $("qrStr").textContent = text;
  $("qrCap").textContent = "Skanuj teraz - kod szybko zdycha. " + text.length + " znaków.";
  var box = $("qrBox");
  box.classList.remove("show");
  void box.offsetWidth;
  show("ZESKANUJ QRKE 3DSEM.");
  box.classList.add("show");
}

show(tbtn("KLIKNIJ BY WYGENEROWAĆ LINK LOGOWANIA", true), true, function (beat) {
  beat.querySelector("button").onclick = onGenerate;
});

</script>
</body>
</html>
